<mat-sidenav-container>
  <mat-sidenav #sidenav mode="side" *ngIf="authService.isAuthenticated()">
    <mat-nav-list>
      <a mat-list-item routerLink="/inicio" routerLinkActive="active">
        <mat-icon>home</mat-icon>
        <span>Início</span>
      </a>

      <a mat-list-item routerLink="/gestao-investimentos-publicos" routerLinkActive="active">
        <mat-icon>trending_up</mat-icon>
        <span>Gestão de Investimentos</span>
      </a>

      <a mat-list-item routerLink="/gestao-orcamentaria" routerLinkActive="active">
        <mat-icon>account_balance</mat-icon>
        <span>Gestão Orçamentária</span>
      </a>

      <a mat-list-item routerLink="/minha-conta" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span>Minha Conta</span>
      </a>

      <a mat-list-item (click)="logout()">
        <mat-icon>exit_to_app</mat-icon>
        <span>Sair</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-mensagem></app-mensagem>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
