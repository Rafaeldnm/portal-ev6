<app-navbar></app-navbar>

<div class="container py-4">
  <div class="row mb-4">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Filtros</h5>
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="categoria" class="form-label">Categoria*</label>
              <select class="form-select" id="categoria"
                      [(ngModel)]="filtros.categoriaId"
                      (ngModelChange)="onCategoriaChange($event)">
                <option [ngValue]="0">Selecione uma categoria</option>
                <option *ngFor="let categoria of categorias" [ngValue]="categoria.Id">
                  {{ categoria.Nome }}
                </option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="anoInicial" class="form-label">Ano Inicial</label>
              <input type="number" class="form-control" id="anoInicial"
                     [(ngModel)]="filtros.anoInicial"
                     min="2000" max="2100">
            </div>
            <div class="col-md-3">
              <label for="anoFinal" class="form-label">Ano Final</label>
              <input type="number" class="form-control" id="anoFinal"
                     [(ngModel)]="filtros.anoFinal"
                     min="2000" max="2100">
            </div>
            <div class="col-md-2" *ngIf="categoriaSelecionada?.TipoValor === 'Financeiro'">
              <label for="tipoValor" class="form-label">Tipo de Valor</label>
              <select class="form-select" id="tipoValor"
                      [(ngModel)]="filtros.tipoValor">
                <option value="historico">Histórico</option>
                <option value="corrigido">Corrigido</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end justify-content-end ms-auto">
              <button class="btn btn-warning w-100" (click)="onFiltroChange()">
                <i class="fas fa-sync-alt me-2"></i>Atualizar Gráfico
              </button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Investimentos por Ano</h5>
            <button class="btn btn-outline-warning" (click)="exportarGrafico()">
              <i class="fas fa-download me-2"></i>Exportar
            </button>
          </div>
          <div class="chart-container" style="position: relative; height: 400px;">
            <canvas id="graficoBarras"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
